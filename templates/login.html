{% extends "base.html" %}

{% block title %}Login - GramDarshan{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-container">

        <div class="auth-header">

            <p class="eyebrow">GRAMDARSHAN</p>

            <h1>Welcome Back</h1>

            <p>
                Login to access information and services
                for your village.
            </p>

        </div>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST" class="auth-form">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit" class="auth-btn">
                Login
            </button>

        </form>


        <div class="auth-footer">

            <p>
                Don't have an account?
                <a href="{{ url_for('register') }}">
                    Register
                </a>
            </p>

        </div>

    </div>

</section>

{% endblock %}
