<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}GramDarshan{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="navbar">

        <div class="container nav-container">

            <a href="{{ url_for('home') }}" class="logo">
                GramDarshan
            </a>

            <nav class="nav-links">

                <a href="{{ url_for('home') }}">
                    Home
                </a>

                <a href="{{ url_for('dashboard') }}">
                    My Village
                </a>

                <a href="{{ url_for('history') }}">
                    History & Heritage
                </a>

                <a href="{{ url_for('schemes') }}">
                    Schemes
                </a>

                <a href="{{ url_for('complaints') }}">
                    Complaints
                </a>

                <a href="{{ url_for('notices') }}">
                    Notices
                </a>

                <a href="{{ url_for('development') }}">
                    Development
                </a>

            </nav>

            <div class="nav-auth">

                {% if session.get("user_id") %}

                <a href="{{ url_for('logout') }}" class="register-link">
                    Logout
                </a>

                {% else %}

                <a href="{{ url_for('login') }}" class="login-btn">
                    Login
                </a>

                <a href="{{ url_for('register') }}" class="register-link">
                    Register
                </a>

                {% endif %}

            </div>

        </div>

    </header>

    <main>

        {% block content %}
        {% endblock %}

    </main>

    <footer class="footer">

        <div class="container">

            <p>GramDarshan</p>

            <span>
                A Digital Village Information and Citizen Service Platform
            </span>

        </div>

    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
