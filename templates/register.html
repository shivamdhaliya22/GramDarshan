{% extends "base.html" %}

{% block title %}Register - GramDarshan{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-container">

        <div class="auth-header">
            <p class="eyebrow">GRAMDARSHAN</p>
            <h1>Create Your Account</h1>
            <p>
                Register to access information and services
                for your village.
            </p>
        </div>


        <form method="POST" class="auth-form">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
            </div>


            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>


            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >
            </div>


            <div class="form-group">
                <label for="village_id">Select Village</label>

                <select id="village_id" name="village_id" required>

                    <option value="" disabled selected>
                        Select your village
                    </option>

                    {% for village in villages %}

                    <option value="{{ village['village_id'] }}">
                        {{ village['village_name'] }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <button type="submit" class="auth-btn">
                Create Account
            </button>

        </form>


        <div class="auth-footer">
            <p>
                Already have an account?
                <a href="{{ url_for('login') }}">Login</a>
            </p>
        </div>

    </div>

</section>

{% endblock %}
